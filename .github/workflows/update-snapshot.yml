name: Update GitHub Profile Snapshot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate live GitHub snapshot SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-snapshot.mjs

      - name: Commit updated snapshot if changed
        run: |
          if git diff --quiet assets/github-snapshot-dark.svg assets/github-snapshot-light.svg; then
            echo "No snapshot changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-snapshot-dark.svg assets/github-snapshot-light.svg
          git commit -m "chore: update live GitHub snapshot SVGs"
          git push
