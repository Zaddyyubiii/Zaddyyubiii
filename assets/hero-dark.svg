<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="hero-dark-title hero-dark-desc">
  <title id="hero-dark-title">Ayubi Fathan - UI/UX Designer and Frontend Developer</title>
  <desc id="hero-dark-desc">Evening slate and warm paper-cream editorial hero showcase featuring Ayubi Fathan's serif headline, studio wireframe composition, and location metadata.</desc>
  <defs>
    <linearGradient id="paper-wash-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E273D" />
      <stop offset="55%" stop-color="#161C2B" />
      <stop offset="100%" stop-color="#121724" />
    </linearGradient>
    <linearGradient id="arch-wash-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3B5E" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#161C2B" stop-opacity="0.1" />
    </linearGradient>
    <clipPath id="hero-clip-dark">
      <rect x="0" y="0" width="1200" height="390" rx="14" />
    </clipPath>
    <style>
      .serif {
        font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      }
      .sans {
        font-family: 'Outfit', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
      }
      @keyframes editorialRise {
        0% { opacity: 0.92; transform: translateY(8px) scale(0.99); }
        100% { opacity: 1; transform: none; }
      }
      .rev-plate { animation: editorialRise 1.0s cubic-bezier(0.16, 1, 0.3, 1) 0ms both; }
      .rev-brand { animation: editorialRise 1.05s cubic-bezier(0.16, 1, 0.3, 1) 0ms both; }
      .rev-h1-a { animation: editorialRise 1.05s cubic-bezier(0.16, 1, 0.3, 1) 140ms both; }
      .rev-h1-b { animation: editorialRise 1.05s cubic-bezier(0.16, 1, 0.3, 1) 240ms both; }
      .rev-copy { animation: editorialRise 1.05s cubic-bezier(0.16, 1, 0.3, 1) 340ms both; }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <g clip-path="url(#hero-clip-dark)">
    <rect x="0" y="0" width="1200" height="390" fill="url(#paper-wash-dark)" />

    <!-- Left Atmospheric Studio Backdrop -->
    <ellipse cx="140" cy="360" rx="340" ry="260" fill="url(#arch-wash-dark)" />
    <path d="M -20 270 Q 170 110 380 250 T 590 190 L 590 410 L -20 410 Z" fill="#25314D" fill-opacity="0.38" />
    <path d="M 30 390 C 80 210 250 150 430 220 C 500 248 545 220 570 175" fill="none" stroke="#9BB3E8" stroke-opacity="0.22" stroke-width="1.2" />

    <!-- Subtle Editorial Wireframe Grid & Minimal UI Layout Plate -->
    <g class="rev-plate">
      <line x1="68" y1="48" x2="532" y2="48" stroke="#9BB3E8" stroke-opacity="0.2" stroke-width="1" />
      <line x1="68" y1="342" x2="532" y2="342" stroke="#9BB3E8" stroke-opacity="0.2" stroke-width="1" />
      <line x1="68" y1="48" x2="68" y2="342" stroke="#9BB3E8" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3 4" />
      <line x1="532" y1="48" x2="532" y2="342" stroke="#9BB3E8" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="3 4" />

      <!-- Minimal Floating UI Plate -->
      <rect x="96" y="76" width="408" height="238" rx="6" fill="#1D2538" fill-opacity="0.92" stroke="#9BB3E8" stroke-opacity="0.35" stroke-width="1.2" />
      <rect x="116" y="96" width="84" height="8" rx="2" fill="#FAE2C6" fill-opacity="0.55" />
      <rect x="386" y="96" width="44" height="8" rx="2" fill="#9BB3E8" fill-opacity="0.35" />
      <rect x="440" y="96" width="44" height="8" rx="2" fill="#9BB3E8" fill-opacity="0.35" />
      <line x1="116" y1="118" x2="484" y2="118" stroke="#2F3C59" stroke-width="1" />

      <rect x="116" y="136" width="164" height="156" rx="6" fill="#161C2B" stroke="#2F3C59" stroke-width="1" />
      <path d="M 134 252 Q 178 190 222 232 T 264 205" fill="none" stroke="#9BB3E8" stroke-opacity="0.55" stroke-width="1.4" />
      <circle cx="164" cy="176" r="18" fill="#FAE2C6" fill-opacity="0.16" stroke="#FAE2C6" stroke-opacity="0.5" stroke-width="1" />

      <rect x="300" y="140" width="128" height="14" rx="2" fill="#FAE2C6" fill-opacity="0.9" />
      <rect x="300" y="166" width="176" height="7" rx="2" fill="#C8D3EC" fill-opacity="0.4" />
      <rect x="300" y="181" width="152" height="7" rx="2" fill="#C8D3EC" fill-opacity="0.28" />
      <rect x="300" y="196" width="164" height="7" rx="2" fill="#C8D3EC" fill-opacity="0.28" />

      <rect x="300" y="226" width="82" height="24" rx="12" fill="none" stroke="#9BB3E8" stroke-opacity="0.75" stroke-width="1.1" />
      <rect x="392" y="226" width="82" height="24" rx="12" fill="#FAE2C6" fill-opacity="0.9" />
      <rect x="300" y="274" width="110" height="5" rx="2" fill="#9BB3E8" fill-opacity="0.3" />
    </g>

    <!-- Right Editorial Column -->
    <g class="rev-brand">
      <text x="585" y="88" class="serif" font-size="27" font-weight="400" fill="#FAE2C6" letter-spacing="1.4">AYUBI FATHAN</text>
    </g>

    <g class="rev-h1-a">
      <text x="585" y="160" class="serif" font-size="48" font-weight="400" fill="#FAE2C6" letter-spacing="0.2">UI/UX DESIGNER &amp;</text>
    </g>
    <g class="rev-h1-b">
      <text x="585" y="214" class="serif" font-size="48" font-weight="400" fill="#FAE2C6" letter-spacing="0.2">FRONTEND DEVELOPER.</text>
    </g>

    <g class="rev-copy">
      <text x="585" y="264" class="sans" font-size="16" font-weight="400" fill="#C8D3EC">
        <tspan x="585" dy="0">Creating meaningful digital experiences</tspan>
        <tspan x="585" dy="24">through design and technology.</tspan>
      </text>
      <line x1="585" y1="312" x2="642" y2="312" stroke="#9BB3E8" stroke-opacity="0.65" stroke-width="1.2" />
      <text x="585" y="338" class="sans" font-size="13" font-weight="400" fill="#9BB3E8">Computer Science, IPB University  &#183;  Jakarta &amp; Bogor, Indonesia</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="389" rx="14" fill="none" stroke="#2F3C59" />
  </g>
</svg>
