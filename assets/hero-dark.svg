<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="hero-dark-title hero-dark-desc">
  <title id="hero-dark-title">Ayubi Fathan - UI/UX Designer and Frontend Developer</title>
  <desc id="hero-dark-desc">Editorial cobalt and midnight navy hero banner featuring Ayubi Fathan's roles, tagline, and a Figma-style component canvas illustration.</desc>
  <defs>
    <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#013AA7" />
      <stop offset="100%" stop-color="#001741" />
    </linearGradient>
    <linearGradient id="canvas-glow-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1938" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#061026" stop-opacity="0.96" />
    </linearGradient>
    <pattern id="halftone-dark" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(24)">
      <circle cx="4" cy="4" r="1.4" fill="#FFFFFF" fill-opacity="0.10" />
      <circle cx="13" cy="13" r="1.1" fill="#60A5FA" fill-opacity="0.09" />
    </pattern>
    <clipPath id="card-clip-dark">
      <rect x="0" y="0" width="1200" height="340" rx="12" />
    </clipPath>
    <style>
      .sans {
        font-family: 'Plus Jakarta Sans', 'Instrument Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
      }
      @keyframes fadeSlideUp {
        0% { opacity: 0.92; transform: translateY(6px); }
        100% { opacity: 1; transform: translateY(0); }
      }
      .anim-1 { animation: fadeSlideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0s both; }
      .anim-2 { animation: fadeSlideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.06s both; }
      .anim-3 { animation: fadeSlideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both; }
      .anim-4 { animation: fadeSlideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.18s both; }
      .anim-canvas { animation: fadeSlideUp 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.1s both; }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <g clip-path="url(#card-clip-dark)">
    <!-- Primary brand gradient backdrop -->
    <rect x="0" y="0" width="1200" height="340" fill="url(#bg-grad-dark)" />
    <!-- Halftone dot texture from Figma Banner Linkedin / Slide 1 -->
    <rect x="0" y="0" width="1200" height="340" fill="url(#halftone-dark)" />
    <!-- Subtle geometric accent arc on right side -->
    <circle cx="1120" cy="310" r="240" fill="#2563EB" fill-opacity="0.14" />
    <rect x="0.5" y="0.5" width="1199" height="339" rx="12" fill="none" stroke="#2563EB" stroke-opacity="0.35" />

    <!-- Left Editorial Column -->
    <g class="anim-1">
      <text x="56" y="92" class="sans" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="-0.6">Ayubi Fathan</text>
    </g>

    <!-- Signature sharp-cornered #013AA7 role blocks -->
    <g class="anim-2">
      <rect x="56" y="114" width="176" height="36" rx="0" fill="#013AA7" stroke="#60A5FA" stroke-opacity="0.55" stroke-width="1" />
      <text x="144" y="137.5" class="sans" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">UI/UX Designer</text>

      <rect x="246" y="114" width="214" height="36" rx="0" fill="#013AA7" stroke="#60A5FA" stroke-opacity="0.55" stroke-width="1" />
      <text x="353" y="137.5" class="sans" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Frontend Developer</text>
    </g>

    <!-- Exact Figma Tagline -->
    <g class="anim-3">
      <text x="56" y="198" class="sans" font-size="22" font-weight="400" fill="#FFFFFF">
        <tspan x="56" dy="0" font-weight="700">&#8220;</tspan><tspan>Creating Meaningful Digital Experiences</tspan>
        <tspan x="56" dy="31">Through </tspan><tspan font-weight="700">Design &amp; Technology&#8221;</tspan>
      </text>
    </g>

    <!-- Grounded Metadata -->
    <g class="anim-4">
      <line x1="56" y1="262" x2="104" y2="262" stroke="#60A5FA" stroke-width="2" />
      <text x="56" y="288" class="sans" font-size="13.5" font-weight="500" fill="#CBD5E1">Computer Science Undergraduate · IPB University · Jakarta &amp; Bogor, Indonesia</text>
    </g>

    <!-- Right Column: Figma-style Component Artboard -->
    <g class="anim-canvas">
      <!-- Outer Artboard Frame -->
      <rect x="768" y="34" width="376" height="272" rx="10" fill="url(#canvas-glow-dark)" stroke="#3B82F6" stroke-opacity="0.32" stroke-width="1" stroke-dasharray="4 4" />

      <!-- Dimension Pill Tag -->
      <rect x="790" y="45" width="90" height="19" rx="2" fill="#2563EB" />
      <text x="835" y="58" class="sans" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Frame · 332x212</text>

      <!-- Selection Bounding Box -->
      <rect x="790" y="68" width="332" height="212" rx="0" fill="#0F1C3A" stroke="#2563EB" stroke-width="1.5" />

      <!-- 4 Corner Resize Handles -->
      <rect x="786.5" y="64.5" width="7" height="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <rect x="1118.5" y="64.5" width="7" height="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <rect x="786.5" y="276.5" width="7" height="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />
      <rect x="1118.5" y="276.5" width="7" height="7" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" />

      <!-- Top Navigation Wireframe inside Artboard -->
      <rect x="808" y="84" width="296" height="26" rx="4" fill="#16264B" />
      <rect x="816" y="91" width="12" height="12" rx="0" fill="#2563EB" />
      <rect x="964" y="95" width="36" height="4" rx="2" fill="#60A5FA" fill-opacity="0.7" />
      <rect x="1010" y="95" width="36" height="4" rx="2" fill="#60A5FA" fill-opacity="0.7" />
      <rect x="1056" y="90" width="40" height="14" rx="0" fill="#013AA7" stroke="#60A5FA" stroke-opacity="0.6" stroke-width="0.8" />

      <!-- Hero UI Wireframe Block -->
      <rect x="808" y="122" width="296" height="60" rx="4" fill="#142347" stroke="#1E3A6E" stroke-width="1" />
      <rect x="822" y="135" width="124" height="9" rx="2" fill="#FFFFFF" fill-opacity="0.92" />
      <rect x="822" y="151" width="174" height="5" rx="2" fill="#94A3B8" fill-opacity="0.65" />
      <rect x="822" y="162" width="112" height="5" rx="2" fill="#94A3B8" fill-opacity="0.45" />
      <rect x="1026" y="140" width="64" height="24" rx="0" fill="#2563EB" />
      <text x="1058" y="155.5" class="sans" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">UI SPEC</text>

      <!-- Two Component Cards with Spacing Guide -->
      <rect x="808" y="196" width="140" height="68" rx="4" fill="#16264B" stroke="#1E3A6E" stroke-width="1" />
      <rect x="818" y="206" width="42" height="22" rx="2" fill="#013AA7" />
      <rect x="868" y="208" width="66" height="6" rx="2" fill="#E2E8F0" fill-opacity="0.85" />
      <rect x="868" y="220" width="48" height="4" rx="2" fill="#60A5FA" fill-opacity="0.75" />
      <rect x="818" y="238" width="118" height="5" rx="2" fill="#94A3B8" fill-opacity="0.45" />
      <rect x="818" y="249" width="84" height="5" rx="2" fill="#94A3B8" fill-opacity="0.35" />

      <!-- Spacing guide 16px -->
      <line x1="948" y1="230" x2="964" y2="230" stroke="#60A5FA" stroke-width="1" stroke-dasharray="2 2" />
      <rect x="947" y="210" width="18" height="14" rx="2" fill="#2563EB" />
      <text x="956" y="220" class="sans" font-size="8.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">16</text>

      <rect x="964" y="196" width="140" height="68" rx="4" fill="#16264B" stroke="#1E3A6E" stroke-width="1" />
      <rect x="974" y="206" width="42" height="22" rx="2" fill="#2563EB" fill-opacity="0.85" />
      <rect x="1024" y="208" width="66" height="6" rx="2" fill="#E2E8F0" fill-opacity="0.85" />
      <rect x="1024" y="220" width="48" height="4" rx="2" fill="#60A5FA" fill-opacity="0.75" />
      <rect x="974" y="238" width="118" height="5" rx="2" fill="#94A3B8" fill-opacity="0.45" />
      <rect x="974" y="249" width="90" height="5" rx="2" fill="#94A3B8" fill-opacity="0.35" />
    </g>
  </g>
</svg>
