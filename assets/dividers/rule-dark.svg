<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="1200" height="36" role="img" aria-label="Animated architectural measure rule divider">
  <title>Animated Blueprint Rule Divider</title>
  <defs>
    <linearGradient id="fade-rd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="8%" stop-color="#FFFFFF" />
      <stop offset="92%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <mask id="mask-rd">
      <rect x="0" y="0" width="1200" height="36" fill="url(#fade-rd)" />
    </mask>
    <pattern id="ticks-rd" width="60" height="36" patternUnits="userSpaceOnUse">
      <line x1="30" y1="14" x2="30" y2="22" stroke="#2F3C59" stroke-width="1" stroke-opacity="0.8" />
    </pattern>
    <style>
      @keyframes slideRule {
        0% { transform: translateX(140px); }
        100% { transform: translateX(920px); }
      }
      .beam { animation: slideRule 8s ease-in-out infinite alternate; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    </style>
  </defs>
  <g mask="url(#mask-rd)">
    <line x1="0" y1="18" x2="1200" y2="18" stroke="#2F3C59" stroke-width="1" stroke-opacity="0.85" />
    <rect x="0" y="0" width="1200" height="36" fill="url(#ticks-rd)" />
    <g class="beam">
      <rect x="0" y="16.75" width="140" height="2.5" rx="1.25" fill="#FAE2C6" fill-opacity="0.85" />
      <rect x="67" y="15" width="6" height="6" transform="rotate(45 70 18)" fill="#9BB3E8" />
    </g>
  </g>
</svg>
