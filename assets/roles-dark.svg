<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 225" width="1200" height="225" role="img" aria-labelledby="roles-dark-title roles-dark-desc">
  <title id="roles-dark-title">About and Current Roles</title>
  <desc id="roles-dark-desc">Editorial summary of Ayubi Fathan's background and an animated vertical timeline of active campus and leadership roles.</desc>
  <defs>
    <clipPath id="roles-clip-dark">
      <rect x="0" y="0" width="1200" height="225" rx="14" />
    </clipPath>
    <style>
      .serif {
        font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif;
      }
      .sans {
        font-family: 'Outfit', 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
      }
      @keyframes beamGlide {
        0%, 24% { transform: translateY(0); }
        33%, 57% { transform: translateY(55px); }
        66%, 90% { transform: translateY(110px); }
        100% { transform: translateY(0); }
      }
      @keyframes focusRow1 {
        0%, 24%, 100% { opacity: 1; }
        33%, 90% { opacity: 0.6; }
      }
      @keyframes focusRow2 {
        0%, 24%, 66%, 100% { opacity: 0.6; }
        33%, 57% { opacity: 1; }
      }
      @keyframes focusRow3 {
        0%, 57%, 100% { opacity: 0.6; }
        66%, 90% { opacity: 1; }
      }
      .tl-beam { animation: beamGlide 9s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .role-1 { animation: focusRow1 9s ease-in-out infinite; }
      .role-2 { animation: focusRow2 9s ease-in-out infinite; }
      .role-3 { animation: focusRow3 9s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; opacity: 1 !important; transform: none !important; }
      }
    </style>
  </defs>

  <g clip-path="url(#roles-clip-dark)">
    <rect x="0" y="0" width="1200" height="225" fill="#161C2B" />
    <rect x="0.5" y="0.5" width="1199" height="224" rx="14" fill="none" stroke="#2F3C59" />

    <!-- Left Bio Column -->
    <rect x="44" y="28" width="132" height="24" rx="0" fill="#FAE2C6" />
    <text x="110" y="44" class="sans" font-size="11" font-weight="500" fill="#161C2B" text-anchor="middle" letter-spacing="0.5">ABOUT &amp; FOCUS</text>

    <text x="44" y="88" class="serif" font-size="28" font-weight="400" fill="#FAE2C6">Bridging product design and web engineering.</text>

    <text x="44" y="124" class="sans" font-size="14.5" font-weight="400" fill="#C8D3EC">
      <tspan x="44" dy="0">Computer Science undergraduate at IPB University working across</tspan>
      <tspan x="44" dy="22">UI/UX design and frontend development. I turn user needs into</tspan>
      <tspan x="44" dy="22">structured interfaces from research and flows to web code.</tspan>
    </text>

    <!-- Panel Divider -->
    <line x1="600" y1="28" x2="600" y2="197" stroke="#2F3C59" stroke-width="1" />

    <!-- Right Animated Roles Timeline -->
    <line x1="646" y1="42" x2="646" y2="188" stroke="#2F3C59" stroke-width="1.5" />
    <g class="tl-beam">
      <rect x="644" y="42" width="4" height="36" rx="2" fill="#FAE2C6" />
    </g>

    <g class="role-1">
      <circle cx="646" cy="56" r="4.5" fill="#1D2538" stroke="#FAE2C6" stroke-width="1.5" />
      <text x="668" y="54" class="sans" font-size="14" font-weight="500" fill="#FAE2C6">OMB IPB 63</text>
      <text x="668" y="73" class="sans" font-size="12.5" font-weight="400" fill="#C8D3EC">Information Systems, Communication &amp; Visual &#183; Dec 2025 - Present</text>
    </g>

    <g class="role-2">
      <circle cx="646" cy="111" r="4.5" fill="#1D2538" stroke="#FAE2C6" stroke-width="1.5" />
      <text x="668" y="109" class="sans" font-size="14" font-weight="500" fill="#FAE2C6">HIMALKOM IPB</text>
      <text x="668" y="128" class="sans" font-size="12.5" font-weight="400" fill="#C8D3EC">Talent &amp; Development, Lead Organizer of I-CONVO &#183; Jan 2026 - Present</text>
    </g>

    <g class="role-3">
      <circle cx="646" cy="166" r="4.5" fill="#1D2538" stroke="#FAE2C6" stroke-width="1.5" />
      <text x="668" y="164" class="sans" font-size="14" font-weight="500" fill="#FAE2C6">IPB University</text>
      <text x="668" y="183" class="sans" font-size="12.5" font-weight="400" fill="#C8D3EC">B.Sc. Computer Science &#183; 2024 - 2028</text>
    </g>
  </g>
</svg>
